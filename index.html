    <meta property="og:title" content="حسب قلب الله" />
    <meta property="og:description" content="منصة مراجعة روحية ونضج مسيحي وتقييم للمكرسين لله (كاهن – مكرَّسة – راهب – راهبة) في العلوم الكنسية والعمق الداخلي" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        // App Boot Diagnostics & Structured Logging System
        var logs = [];
        var startTime = performance.now();

        function log(level, message, extra) {
          var time = ((performance.now() - startTime) / 1000).toFixed(3) + 's';
          var logEntry = { time: time, level: level, message: message, extra: extra || null };
          logs.push(logEntry);

          var prefix = '%c[AppBoot ' + time + '] [' + level + ']';
          var style = level === 'ERROR' ? 'color: #ef4444; font-weight: bold;' :
                      level === 'WARN'  ? 'color: #f59e0b; font-weight: bold;' :
                      level === 'SUCCESS' ? 'color: #10b981; font-weight: bold;' :
                      'color: #3b82f6; font-weight: bold;';

          if (extra !== undefined && extra !== null) {
            console.log(prefix + ' ' + message, style, extra);
          } else {
            console.log(prefix + ' ' + message, style);
          }
        }

        window.__APP_BOOT_LOGGER__ = {
          log: log,
          getLogs: function() { return logs; },
          markMounted: function() {
            log('SUCCESS', 'React App mounted successfully!');
            window.__REACT_MOUNTED__ = true;
          }
        };

        log('INFO', 'Initializing "حسب قلب الله" Boot Sequence...');

        // 1. React Fast Refresh Preamble Guard for Vite preview
        window.$RefreshReg$ = window.$RefreshReg$ || function() {};
        window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
        window.__vite_plugin_react_preamble_installed__ = true;

        // 2. Storage & Web API Capability Check
        try {
          var testKey = '__boot_storage_test__';
          localStorage.setItem(testKey, '1');
          localStorage.removeItem(testKey);
          log('INFO', 'Local Storage accessibility confirmed.');
        } catch (e) {
          log('WARN', 'Local Storage restricted or unavailable in window context.', e.message);
        }

        // 3. Helper to detect Vite HMR WebSocket disconnect noise (HMR is disabled in cloud sandbox)
        function isViteHmrNoise(args) {
          if (!args) return false;
          var combined = '';
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            if (!item) continue;
            if (typeof item === 'string') {
              combined += ' ' + item;
            } else if (item instanceof Error) {
              combined += ' ' + (item.message || '') + ' ' + (item.stack || '');
            } else if (typeof item === 'object') {
              try {
                combined += ' ' + (item.message || '') + ' ' + (item.stack || '') + ' ' + (item.reason || '') + ' ' + (item.filename || '');
              } catch (e) {}
            }
          }
          if (combined.indexOf('WebSocket closed without opened') !== -1) return true;
          if (combined.indexOf('[vite]') !== -1 && (
            combined.indexOf('failed to connect to websocket') !== -1 ||
            combined.indexOf('connection lost') !== -1 ||
            combined.indexOf('server connection lost') !== -1 ||
            combined.indexOf('WebSocket') !== -1
          )) {
            return true;
          }
          return false;
        }

        // Targeted Console Error Filter for Vite HMR
        var originalConsoleError = console.error;
        console.error = function() {
          if (isViteHmrNoise(arguments)) {
            return;
          }
          return originalConsoleError.apply(console, arguments);
        };

        // 4. Uncaught Error Event Listener (non-blocking diagnostic logger)
        window.addEventListener('error', function(event) {
          if (isViteHmrNoise([event && event.message, event && event.filename, event && event.error])) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return;
          }

          var msg = event && event.message ? event.message : '';
          var source = event && event.filename ? event.filename : '';
          var line = event && event.lineno ? event.lineno : 0;
          var col = event && event.colno ? event.colno : 0;
          var err = event && event.error ? event.error : null;

          // Do NOT suppress real errors or stop propagation. Only log diagnostic record.
          log('ERROR', 'Uncaught Runtime Error: ' + msg + ' @ ' + source + ':' + line + ':' + col, err);

          // If React root has not mounted yet after critical error, display diagnostic notice
          if (!window.__REACT_MOUNTED__) {
            showDiagnosticNotice(msg, source + ':' + line);
          }
        });

        // 5. Unhandled Promise Rejection Listener (non-blocking diagnostic logger)
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (isViteHmrNoise([reason])) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return;
          }

          var reasonMsg = reason && (reason.stack || reason.message) ? String(reason.stack || reason.message) : String(reason);

          // Do NOT suppress rejections or stop propagation. Only log diagnostic record.
          log('ERROR', 'Unhandled Promise Rejection: ' + reasonMsg, reason);

          if (!window.__REACT_MOUNTED__) {
            showDiagnosticNotice('Promise Rejection: ' + reasonMsg, 'Async Initializer');
          }
        });

        // 5. Watchdog Timeout for Initial Load
        setTimeout(function() {
          if (!window.__REACT_MOUNTED__) {
            log('WARN', 'App boot notice: React root has not reported mounted within 8s.');
          }
        }, 8000);

        // Helper to render diagnostic UI on initial load failure
        function showDiagnosticNotice(errorMsg, locationStr) {
          var rootEl = document.getElementById('root');
          if (!rootEl || window.__REACT_MOUNTED__) return;

          rootEl.innerHTML =
            '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0a09; color: #f5f5f4; text-align: center; font-family: system-ui, -apple-system, sans-serif; padding: 24px;" dir="rtl">' +
              '<div style="width: 72px; height: 72px; border-radius: 20px; background: rgba(245, 158, 11, 0.15); border: 2px solid rgba(245, 158, 11, 0.4); display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 16px;">' +
                '✝️' +
              '</div>' +
              '<h1 style="font-size: 20px; font-weight: 800; color: #fbbf24; margin: 0 0 8px 0;">حسب قلب الله</h1>' +
              '<p style="font-size: 13px; color: #d6d3d1; max-width: 360px; line-height: 1.6; margin: 0 0 16px 0;">' +
                'جاري ضبط الاتصال وإتاحة التطبيق بالكامل...' +
              '</p>' +
              '<div style="background: rgba(28, 25, 23, 0.9); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 10px 14px; font-size: 11px; font-family: monospace; color: #fbbf24; max-width: 420px; text-align: left; direction: ltr; margin-bottom: 20px; word-break: break-all; box-shadow: 0 8px 20px rgba(0,0,0,0.4);">' +
                'Boot Error: ' + (errorMsg || 'Load Failure').replace(/</g, '&lt;') + '<br>Context: ' + (locationStr || 'main.tsx').replace(/</g, '&lt;') +
              '</div>' +
              '<button onclick="window.location.reload()" style="background: #f59e0b; color: #0c0a09; border: none; padding: 10px 22px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(245,158,11,0.3);">' +
                'إعادة التحميل 🔄' +
              '</button>' +
            '</div>';
        }
      })();
    </script>
    <style>
      @keyframes spinLoader {
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .initial-spin {
        animation: spinLoader 1.1s linear infinite;
      }
      .initial-glow {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-stone-900 text-stone-100 font-sans antialiased min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0a09; color: #f5f5f4; text-align: center; font-family: 'Cairo', system-ui, sans-serif; padding: 24px;" dir="rtl">
        <div class="initial-glow" style="width: 76px; height: 76px; border-radius: 24px; background: rgba(245, 158, 11, 0.15); border: 2px solid rgba(245, 158, 11, 0.4); display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 20px; box-shadow: 0 12px 30px -6px rgba(245, 158, 11, 0.25);">
          ✝️
        </div>
        <h1 style="font-size: 24px; font-weight: 800; color: #fbbf24; margin: 0 0 8px 0; letter-spacing: -0.02em;">حسب قلب الله</h1>
        <p style="font-size: 13px; color: #a8a29e; max-width: 320px; line-height: 1.6; margin: 0 0 24px 0;">
          بوابة التكريس والعلوم الكنسية والتقييم الروحي
        </p>
        <div style="display: flex; align-items: center; gap: 8px; color: #fbbf24; font-size: 12px; font-weight: 600;">
          <div class="initial-spin" style="width: 20px; height: 20px; border: 2.5px solid rgba(245, 158, 11, 0.25); border-top-color: #f59e0b; border-radius: 50%;"></div>
          <span>جاري فتح التطبيق بالبركة...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
