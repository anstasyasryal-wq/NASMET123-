<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />
  <!-- Orthodox Cross -->
  <g filter="url(#glow)">
    <!-- Vertical beam -->
    <rect x="236" y="96" width="40" height="320" rx="8" fill="url(#goldGrad)" />
    <!-- Main horizontal cross beam -->
    <rect x="136" y="196" width="240" height="40" rx="8" fill="url(#goldGrad)" />
    <!-- Top small titulus bar -->
    <rect x="196" y="136" width="120" height="24" rx="6" fill="url(#goldGrad)" />
    <!-- Slanted footrest beam -->
    <rect x="180" y="340" width="152" height="26" rx="6" fill="url(#goldGrad)" transform="rotate(-18, 256, 353)" />
    <!-- Center ray accents -->
    <circle cx="256" cy="216" r="14" fill="#fde68a" />
  </g>
</svg>
